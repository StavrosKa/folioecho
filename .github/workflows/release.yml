name: Release and package
on:
  push:
    branches: [main]
    paths:
      - package.json
      - Dockerfile
      - .dockerignore
      - .github/workflows/release.yml
      - docs/releases/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: folioecho-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Read release metadata
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then exit 1; fi
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            test -f "docs/releases/v$VERSION.md"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install and validate
        if: steps.release.outputs.publish == 'true'
        run: |
          npm ci
          npm run check
          npm test
          npm run build
          FOLIOECHO_NETLIFY_BUILD=1 npm run build
      - name: Build and smoke-test container
        if: steps.release.outputs.publish == 'true'
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          docker build --tag "$IMAGE:$VERSION" --tag "$IMAGE:latest" --label "org.opencontainers.image.revision=$GITHUB_SHA" .
          trap 'status=$?; if [ "$status" -ne 0 ]; then docker logs folioecho-release-test; fi; docker rm -f -v folioecho-release-test >/dev/null 2>&1 || true; exit "$status"' EXIT
          docker run --detach --name folioecho-release-test --publish 127.0.0.1:4321:4321 "$IMAGE:$VERSION"
          curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-connrefused --retry-delay 1 http://127.0.0.1:4321/api/health | node -e "let body='';process.stdin.on('data',x=>body+=x);process.stdin.on('end',()=>{if(JSON.parse(body).storage!=='ready')process.exit(1);console.log('Container storage health passed.');});"
      - name: Publish GitHub Container Registry package
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
          docker logout ghcr.io
      - name: Publish GitHub release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "FolioEcho v$VERSION" --notes-file "docs/releases/v$VERSION.md"
